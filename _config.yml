# Site settings
title: Ralph Warrand
email: ralphwarrand@gmail.com
description: >-
  Ralph Warrand, software engineer working across games and simulation. Two UE5
  games released on Steam, engines built from scratch, and an MSc thesis at TU/e on
  constrained multibody simulation, plus GPU particle physics and a NES emulator.
tagline: Software Engineer, Games & Simulation
# Social preview for pages without their own `image`
og_image: /assets/hexforge/xpbd-fluid-splash.jpg
github: https://github.com/giralfe
linkedin: https://linkedin.com/in/ralphwarrand
itch: https://ralphwarrand.itch.io
# Google Search Console > Add property > URL prefix https://giralfe.github.io/portfolio/
# > HTML tag: paste only the content="..." value here.
google_site_verification: 9O2sSy_qF8UevcSFJcQefIfTSzJ6TV3aVsF26Vkcd8s
baseurl: "/portfolio"
url: "https://giralfe.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  # - jekyll-feed

# Collections
collections:
  projects:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Local-only research data - slide JSONs, source media, extractor scripts.
  # Excluded from the published site so builds don't have to copy hundreds of MB.
  - extracted_data/
  - _gif-originals/
  - _nda-excluded/
  - _unused-assets/
  - .gitignore
  - README.md
  - _resume/
  - vendor/

