<div class="video-showcase{% if include.wide %} wide{% endif %}">
  <div class="video-container yt-embed">
    <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}?rel=0" title="{{ include.title | escape }}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  {% if include.caption %}<p class="video-caption">{{ include.caption }}</p>{% endif %}
</div>
